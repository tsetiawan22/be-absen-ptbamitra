version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: absensi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-absensi}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-absensi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  face-detector:
    build:
      context: ./face-detector
      dockerfile: Dockerfile
    container_name: absensi_face
    restart: unless-stopped
    ports:
      - "${FACE_PORT:-5000}:5000"
    environment:
      - INTERNAL_KEY=${INTERNAL_KEY:-ganti_rahasia_internal}
      - BACKEND_URL=http://backend:3000
      - FACE_THRESHOLD=${FACE_THRESHOLD:-0.5}
      - FACE_PORT=5000
    volumes:
      - ./uploads:/app/uploads
      - ./uploads:/uploads

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: absensi_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      face-detector:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-absensi}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-ganti_ini}
      - JWT_EXPIRES=${JWT_EXPIRES:-1d}
      - FACE_URL=http://face-detector:5000
      - BACKEND_URL=http://backend:3000
      - INTERNAL_KEY=${INTERNAL_KEY:-ganti_rahasia_internal}
      - BACKEND_PORT=3000
    volumes:
      - ./uploads:/uploads
      - ./uploads:/app/uploads

volumes:
  pgdata:

